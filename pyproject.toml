[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-listcopy"
version = "0.1.0"
description = "Copy X/Twitter List members with logged-in web cookies, dry-run safety checks, and duplicate skipping."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "x-listcopy contributors" }
]
keywords = ["x", "twitter", "lists", "cli", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/your-name/x-listcopy"
Issues = "https://github.com/your-name/x-listcopy/issues"

[project.scripts]
x-listcopy = "x_listcopy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
